function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function pill(text,kind=''){return '<span class="pill '+kind+'">'+escape(text)+'</span>'}
function metrics(s){const stale=state.scenario==='offline';return '<div class="metrics">'+[['人口',s.pop,s.popChange],['可用资金',s.cash,s.cashChange],['月收支',s.balance,s.balanceChange],['交通流畅度',s.traffic,s.trafficChange]].map((a,i)=>'<div class="metric"><div class="muted smalltext">'+a[0]+'</div><strong class="num">'+a[1]+'</strong><div class="smalltext '+(!stale&&i===2?(s.balance.startsWith('−')?'negative':'positive'):'muted')+'">'+a[2]+'</div></div>').join('')+'</div>'}
function stages(n){const labels=['核实原因','游戏预检','执行读回','观察效果'];return '<div class="stage-track">'+labels.map((t,i)=>(i?'<span class="stage-arrow" aria-hidden="true">›</span>':'')+'<span class="stage '+(i<n?'done':i===n?'active':'')+'">'+(i<n?'✓ ':'')+t+'</span>').join('')+'</div>'}
function task(title,desc,status,action,kind=''){return '<button class="task-row" data-action="'+action+'"><span class="task-icon" aria-hidden="true">'+(kind==='green'?'✓':'·')+'</span><span class="task-main">'+escape(title)+'<span class="muted">'+escape(desc)+'</span></span>'+pill(status,kind)+'<span class="muted" aria-hidden="true">›</span></button>'}

body+='<div class="row between task-head"><h2>接下来值得处理</h2><button class="ghost small" data-action="all-issues">查看问题</button></div>';

function records(){const items=[...state.logs,{time:'14:32',title:'路口控制调整',status:'效果待观察',kind:'amber',text:'游戏已确认修改。等待车辆重新分布，尚未判定治堵成功。',details:'操作确认与效果确认分开记录；本次花费 ₡ 0。'},{time:'14:29',title:'设施道路接入恢复',status:'读回确认',kind:'green',text:'公墓入口与道路已连接。后续继续观察服务车辆。',details:'执行结果来自游戏连接读口，不以命令返回成功代替。'},{time:'14:26',title:'设施选址暂缓',status:'游戏暂忙',kind:'',text:'游戏忙碌，未得到有效裁决；没有记成选址失败。',details:'瞬时拒绝不降低经验成功率，不立即重复预检。'}];return '<div class="section-heading"><h1>经营记录</h1><p class="muted">只记录做过什么，以及游戏确认了什么。</p></div><section class="panel"><div class="row between wrap"><h2>本次接管</h2><button class="small" data-action="export">导出诊断记录</button></div><ol class="records">'+items.map(x=>'<li class="record"><div class="muted num">'+escape(x.time)+'</div><div><div class="row between wrap"><h3>'+escape(x.title)+'</h3>'+pill(x.status,x.kind)+'</div><p>'+escape(x.text)+'</p><details><summary>查看证据</summary><p>'+escape(x.details)+'</p></details></div></li>').join('')+'</ol></section><section class="panel"><div class="row between wrap"><h2>本地经验</h2>'+pill('仅在此设备保存')+'</div><p class="muted" style="margin-top:12px">同类问题优先尝试有依据的方案，仍由当前游戏预检裁决。</p><div class="setting-row"><div>设施接入选址<p>3 次效果确认 · 不保存跨地图绝对坐标</p></div><button class="small" data-action="memory">查看配方</button></div><div class="setting-row"><div>工业区路口控制<p>效果正在观察 · 尚未形成成功经验</p></div>'+pill('未确认','amber')+'</div><button class="ghost small" style="margin-top:12px" data-action="clear-memory">清除本城经验</button></section>'}
function settings(){return '<div class="section-heading"><h1>设置</h1><p class="muted">日常经营只需要少量设置。</p></div><section class="panel"><h2>游戏与运行</h2><div class="setting-row"><div>游戏连接<p>'+(state.scenario==='offline'?'暂时中断 · 新操作已停止':'已连接青川市 · 本地运行')+'</p></div><button class="small" data-action="retry">检查连接</button></div><div class="setting-row"><div>游戏模拟<p>暂停市长只停止新操作，不自动暂停游戏。</p></div><button class="small" data-action="simulation">查看与控制</button></div><div class="setting-row"><div>接管前备份<p>独立保留，后续检查点不覆盖原始备份。</p></div>'+pill(state.backup?'已保留':'演示：尚未创建',state.backup?'green':'')+'</div></section><section class="panel"><h2>表达与显示</h2><div class="setting-row"><div>深色界面<p>减少与游戏切换时的亮度落差。</p></div><input class="switch" type="checkbox" id="theme-switch" aria-label="深色界面" '+(state.theme==='dark'?'checked':'')+'></div><div class="setting-row"><div>朗读市长汇报<p>默认关闭；不会阻塞城市经营。</p></div><input class="switch" type="checkbox" id="voice-switch" aria-label="朗读市长汇报" '+(state.voice?'checked':'')+'></div></section><section class="panel"><h2>意图理解</h2><p class="muted" style="margin:12px 0">外部 AI 负责理解交办。本地市长仍负责选址、预检、施工和读回。</p><div class="row between wrap"><span>'+pill('演示：已配置','green')+'</span><button class="small" data-action="ai-settings">连接设置</button></div></section><button class="ghost small" data-action="technical">查看诊断详情</button>'}

function boundaries(first=false){modal(first?'接管青川市':'接管边界','<p class="muted">确认一次，市长在这些范围内持续经营。后续可随时调整。</p><label class="field">经营目标<textarea id="boundary-goal">'+escape(state.goal)+'</textarea></label><div class="subhead"><h3>允许修改</h3></div>'+[['road','局部道路与路口','允许改善已有道路；保留对象和区域优先。',state.allowRoad],['finance','税率与服务预算','小步调整并观察效果。',state.allowFinance],['land','购买新地块','允许在发展需要时购买。',state.allowLand]].map(x=>'<label class="check"><input type="checkbox" id="allow-'+x[0]+'" '+(x[3]?'checked':'')+'><span>'+x[1]+'<span class="muted">'+x[2]+'</span></span></label>').join('')+'<div class="receipt"><strong>默认保留现有建筑</strong><p class="smalltext muted" style="margin-top:6px">拆除、迁移和改划已有街区需要明确的对象与范围授权。游戏预检通过不代替你的授权。</p></div><button class="small" data-action="preserve">添加保留对象或区域</button><div class="divider"></div><label class="check"><input type="checkbox" id="backup-first" '+(state.backup?'checked':'')+'><span>保留接管前的原始存档<span class="muted">开始接管前创建独立备份，并确认游戏保存完成。</span></span></label><div id="boundary-error" role="alert" class="negative smalltext" hidden></div>','<button data-action="close">取消</button><button class="primary" data-action="save-boundaries" data-first="'+first+'">'+(first?'备份并开始接管':'保存边界')+'</button>')}
function reviewIntent(){const text=$('intent').value.trim();if(!text){$('intent').focus();toast('先告诉市长你想改变什么。');return}state.pendingIntent=text;const unsupported=/任意车道|信号配时|绿波|每个车道/.test(text);const destructive=/拆掉|拆除|铲掉/.test(text);let kind=unsupported?'当前能力不支持':destructive?'需要明确对象和授权':'已理解交办';let body='<p class="muted">这是一份交办预览；实际产品由过滤器和确定性编译器生成。</p><div class="receipt"><strong>'+kind+'</strong><dl><dt>你的话</dt><dd>'+escape(text)+'</dd><dt>范围</dt><dd>当前城市；具体区域仍需本地确认</dd><dt>保留</dt><dd>沿用已设定的保留对象和接管边界</dd></dl></div>';

modal('交办预览',body,unsupported||destructive?'<button data-action="close">返回修改</button>':'<button data-action="close">返回修改</button><button class="primary" data-action="confirm-intent">确认交办</button>')}
function actionDetail(){const s=scenarios[state.scenario];modal(s.title,'<p class="muted">'+s.copy+'</p><ul class="details-list"><li><span>当前阶段</span><span>'+['核实原因','游戏预检','执行读回','观察效果'][s.stage]+'</span></li><li><span>资金与影响</span><span class="muted">'+s.cost+'</span></li><li><span>操作对象</span><span class="muted">工业区入口路口 · 示例对象</span></li></ul><div class="subhead"><h3>局部道路示意</h3><p class="muted smalltext">示意数据；实际产品直接定位游戏对象，不另建全城地图。</p></div><svg class="road-schema" viewBox="0 0 480 180" role="img" aria-label="示意道路：入口排队集中，下游仍有通行空间"><path d="M40 90H445M225 22V158" stroke="var(--line)" stroke-width="24" fill="none"/><path d="M55 90H200" stroke="var(--amber)" stroke-width="5" fill="none" stroke-dasharray="9 8"/><path d="M245 90H400" stroke="var(--green)" stroke-width="4" fill="none"/><circle cx="225" cy="90" r="13" fill="var(--bluebg)" stroke="var(--blue)" stroke-width="2"/><text x="65" y="134">入口持续排队</text><text x="302" y="134">下游仍可通行</text><text x="245" y="40">检查路口控制</text></svg><div class="footnote">原型不会改动游戏；预检、施工和效果确认由真实能力提供。</div>','<button data-action="locate">在游戏中定位</button><button data-action="close">关闭</button>')}
function handle(action,target){switch(action){case'close':$('dialog').close();break;case'run':if(!state.takenOver){boundaries(true);return}if(state.running){state.running=false;if(state.scenario==='growth'){state.pausedPending=true;render();setTimeout(()=>{state.pausedPending=false;render();toast('示例：操作已读回，市长暂停。游戏仍继续。')},900)}else{render();toast('市长已暂停；游戏仍可继续模拟。')}}else{state.running=true;render();toast('继续自治，先读取当前城市。')}break;case'takeover':boundaries(true);break;case'boundaries':boundaries(false);break;case'save-boundaries':{if(!state.takenOver&&!$('backup-first').checked){$('boundary-error').hidden=false;$('boundary-error').textContent='开始接管前，需要保留独立原始备份。';return}state.goal=$('boundary-goal').value.trim()||state.goal;state.allowRoad=$('allow-road').checked;state.allowFinance=$('allow-finance').checked;state.allowLand=$('allow-land').checked;state.backup=$('backup-first').checked;if(!state.takenOver){state.takenOver=true;state.running=true;state.scenario='gap';$('scenario').value='gap'}$('dialog').close();render();toast('示例：边界已保存'+(state.backup?'，原始备份已确认。':'。'));break}case'preserve':toast('示例：从游戏选中对象或指定区域后加入保留清单；本原型没有游戏选择器。');break;case'action-detail':actionDetail();break;case'all-issues':modal('城市问题','<p class="muted">按受影响系统归组。没有读到的区域不能当成已解决。</p>'+task('交通与车辆通行','入口排队；共同原因尚未全部确认','检查中','action-detail','amber')+task('服务积压','垃圾、殡葬：先查已有设施工作状态','待检查','service-detail')+task('住宅与就业','检查真实入住和岗位，不用空区划代替空房率','待检查','population-detail')+'<div class="footnote">示例：当前列表完整性未知。实际界面显示读取范围与是否截断。</div>');break;case'service-detail':modal('服务问题的依据','<p>先读取设施效率、车辆和处理能力，再检查服务目标的道路可达性。</p><ul class="details-list"><li><span>设施道路接入</span>'+pill('游戏已确认','green')+'</li><li><span>车辆实际派出与到达</span>'+pill('等待检查','amber')+'</li><li><span>提示数量减少</span>'+pill('尚未确认')+'</li></ul><p class="muted smalltext">路接好不代表服务已经恢复，不直接判定需要增加设施。</p>');break;case'finance-detail':modal('财政恢复','<p>先区分余额、月收支和债务，再判断持续亏损的来源。</p><ul class="details-list"><li><span>现金余额</span><span>− ₡ 82,400</span></li><li><span>月收支估算</span><span>− ₡ 31,200</span></li><li><span>当前做法</span><span>暂缓扩张，核实已有服务</span></li></ul><p class="muted">示例：尚未调整税率或贷款；改变后需要观察窗口。</p>');break;case'population-detail':modal('人口变化','<p>人口趋势结合迁入迁出、服务、就业和真实住宅入住分析。</p><div class="receipt">每栋住宅入住数据尚未读取时，显示“未知”；不把未长楼的区划格当成空房。</div>');break;case'mission-detail':state.page='mission';$('dialog').close();render();break;case'edit-goal':$('intent').value=state.goal;$('intent').focus();break;case'confirm-intent':state.goal=state.pendingIntent;state.logs.unshift({time:'刚刚',title:'交办目标已更新',status:'已接收',kind:'blue',text:state.goal,details:'仅更新目标，不把接收交办视为施工完成。接管边界保持有效。'});$('intent').value='';$('dialog').close();render();toast('目标已更新；市长将按当前边界继续。');break;case'locate':toast('示例：定位工业区入口。实际产品调用已有摄像机定位能力。');break;case'retry':if(state.scenario==='offline')modal('恢复游戏连接','<p>示例状态：先恢复连接并读取未决操作，确认之后继续自治。</p><div class="receipt">若游戏已退出，只提示启动游戏和加载城市，不自动读档。</div>','<button data-action="close">保持此状态</button><button class="primary" data-action="simulate-recovered">演示连接恢复</button>');else toast('示例：游戏已连接。实际产品应分别检查运行时与游戏。');break;case'simulate-recovered':state.scenario='waiting';$('scenario').value='waiting';$('dialog').close();render();toast('示例：已恢复连接，上一项操作结果已确认。');break;case'simulation':modal('游戏模拟','<p>市长暂停和游戏暂停互相独立。</p><ul class="details-list"><li><span>市长</span><span>'+(state.running?'自治运行':'已暂停')+'</span></li><li><span>游戏</span><span>模拟运行中 · 示例</span></li></ul>','<button data-action="close">关闭</button><button data-action="pause-game">暂停游戏模拟</button>');break;case'pause-game':toast('示例：游戏模拟暂停；实际产品等待游戏读回确认。');$('dialog').close();break;case'memory':modal('设施接入选址经验','<p>优先检查设施接入面与道路方向，再生成少量几何候选。</p><ul class="details-list"><li><span>复用条件</span><span class="muted">设施类型、接入面、道路及地形条件</span></li><li><span>确认效果</span><span class="muted">3 次 · 示例</span></li><li><span>使用方式</span><span class="muted">仅帮助选择；仍需游戏预检</span></li></ul><p class="muted">过期条件重新评估；游戏忙碌不记成方案失败。</p>');break;case'clear-memory':modal('清除本城经验','<p>清除本城的候选排序和拒绝提示。未决操作的重复保护不会一起删除。</p><p class="muted smalltext" style="margin-top:12px">不会撤销游戏变化，也不删除诊断记录。</p>','<button data-action="close">取消</button><button class="danger" data-action="confirm-clear-memory">清除经验</button>');break;case'confirm-clear-memory':$('dialog').close();toast('示例：经验已清除；未决操作保护保留。');break;case'export':{const blob=new Blob([JSON.stringify({prototype:true,city:'青川市',scenario:state.scenario,goal:state.goal,events:state.logs,note:'演示导出，不含真实游戏数据'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ai-mayor-demo-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('已导出示例记录。');break}case'ai-settings':modal('意图理解连接','<p class="muted">实际产品沿用现有 AI 配置，不在此重新实现鉴权或编译器。</p><label class="field">连接方式<select><option>沿用已有配置</option><option>自定义 API（高级）</option></select></label><label class="field">API 地址<input placeholder="https://…" autocomplete="off"></label><label class="field">密钥<input type="password" placeholder="仅由现有安全存储保存" autocomplete="off"></label><div class="footnote">示例表单；输入不保存、不发送。AI 连接不可用时，本地自治可继续。</div>','<button data-action="close">关闭</button>');break;case'technical':modal('诊断详情','<ul class="details-list"><li><span>游戏连接</span><span>'+ (state.scenario==='offline'?'中断':'已连接')+'</span></li><li><span>城市读数</span><span>示例数据 · 非真实遥测</span></li><li><span>交通读取</span><span>'+(state.scenario==='gap'?'缺少能力':'拟议能力 · 示例')+'</span></li><li><span>当前操作</span><span>'+scenarios[state.scenario].title+'</span></li></ul><p class="muted">实际诊断应包含当前阶段、操作编号、截止时间、最后有效进展；不把这些塞进首页。</p>');break;default:toast('此操作仅用于设计演示。')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render();return}if(b.dataset.goal){$('intent').value=b.dataset.goal;$('intent').focus();return}if(b.dataset.action)handle(b.dataset.action,b)});
$('scenario').addEventListener('change',e=>{state.scenario=e.target.value;state.takenOver=state.scenario!=='takeover';state.running=state.takenOver;state.pausedPending=false;state.page='city';render()});
$('intent-form').addEventListener('submit',e=>{e.preventDefault();reviewIntent()});$('intent').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();reviewIntent()}});
$('voice-toggle').addEventListener('click',()=>{state.voice=!state.voice;render();toast('原型只切换朗读状态，不实际发声。')});
document.addEventListener('change',e=>{if(e.target.id==='theme-switch'){state.theme=e.target.checked?'dark':'light';render()}if(e.target.id==='voice-switch'){state.voice=e.target.checked;render()}});
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close()}});
render();
})();
</script>
</body></html>
